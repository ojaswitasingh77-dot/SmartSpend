<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartSpend — Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <h2>💸 SmartSpend</h2>
    <button onclick="showSection('dashboard')">Dashboard</button>
    <button onclick="showSection('transactions')">Transactions</button>
    <button onclick="showSection('budgets')">Budgets</button>
    <button onclick="showSection('insights')">Insights</button>
    <button onclick="showSection('goals')">Goals</button>
  </div>

  <!-- Main content -->
  <div class="main">
    <div id="login-container">
      <h2>Login</h2>
      <input type="text" id="username" placeholder="Enter username">
      <input type="password" id="password" placeholder="Enter password">
      <button onclick="login()">Login</button>
    </div>

    <div id="app" style="display:none;">
      <!-- Dashboard -->
      <section id="dashboard" class="page active">
        <h1>Dashboard</h1>
        <p><b>Current Balance:</b> ₹<span id="current-balance">0</span></p>
        <p><b>Total Saved:</b> ₹<span id="total-saved">0</span></p>
        <canvas id="dashboardChart"></canvas>
      </section>

      <!-- Transactions -->
      <section id="transactions" class="page">
        <h1>Transactions</h1>
        <input type="number" id="amount" placeholder="Enter amount">
        <select id="type">
          <option value="Expense">Expense</option>
          <option value="Income">Income</option>
        </select>
        <select id="category">
          <option>Food</option>
          <option>Transport</option>
          <option>Rent</option>
          <option>Entertainment</option>
          <option>Studies</option>
          <option>Misc</option>
        </select>
        <button onclick="addTransaction()">Add</button>
        <h3>All Transactions</h3>
        <ul id="transaction-list"></ul>
      </section>

      <!-- Budgets -->
      <section id="budgets" class="page">
        <h1>Budgets</h1>
        <input type="number" id="budget" placeholder="Enter monthly budget">
        <button onclick="setBudget()">Set Budget</button>
        <p>Budget set: ₹<span id="budget-display">0</span></p>
      </section>

      <!-- Insights -->
      <section id="insights" class="page">
        <h1>Insights</h1>
        <canvas id="insightChart"></canvas>
      </section>

      <!-- Goals -->
      <section id="goals" class="page">
        <h1>Goals</h1>
        <p>Coming soon...</p>
      </section>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
